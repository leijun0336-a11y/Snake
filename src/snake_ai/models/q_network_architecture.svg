<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1680" viewBox="0 0 1200 1680" role="img" aria-labelledby="title desc">
  <title id="title">Snake AI 当前 QNetwork 架构图</title>
  <desc id="desc">默认 Hybrid 与 Dueling QNetwork，从九通道棋盘输入，经卷积残差主干、全局和蛇头局部分支、人工状态融合，最后输出三个动作 Q 值。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#24436b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334e68"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a43; }
      .subtitle { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #486581; }
      .box-title { font: 700 21px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #102a43; }
      .box-text { font: 400 17px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #243b53; }
      .small { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #486581; }
      .formula { font: 600 18px Consolas, "Microsoft YaHei", monospace; fill: #102a43; }
      .arrow { stroke: #334e68; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .blue { fill: #eaf2ff; stroke: #2563eb; stroke-width: 2.5; }
      .cyan { fill: #e7f8fb; stroke: #0891b2; stroke-width: 2.5; }
      .green { fill: #ecfdf3; stroke: #16a34a; stroke-width: 2.5; }
      .purple { fill: #f5efff; stroke: #7c3aed; stroke-width: 2.5; }
      .orange { fill: #fff6e8; stroke: #ea580c; stroke-width: 2.5; }
      .gray { fill: #f8fafc; stroke: #829ab1; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="1680" rx="28" fill="url(#background)"/>
  <text id="title-text" class="title" x="600" y="54" text-anchor="middle">Snake AI 当前 QNetwork 架构</text>
  <text class="subtitle" x="600" y="84" text-anchor="middle">默认路径：Hybrid + Dueling　｜　B=Batch，H/W=棋盘高宽，Cₚ=投影通道（默认 8）</text>

  <!-- Grid input -->
  <rect class="blue" filter="url(#shadow)" x="260" y="112" width="680" height="82" rx="16"/>
  <text class="box-title" x="600" y="146" text-anchor="middle">1. 九通道棋盘输入</text>
  <text class="formula" x="600" y="176" text-anchor="middle">Grid [B, 9, H, W]</text>

  <path class="arrow" d="M 600 194 L 600 226"/>

  <!-- Stem -->
  <rect class="blue" filter="url(#shadow)" x="260" y="230" width="680" height="92" rx="16"/>
  <text class="box-title" x="600" y="264" text-anchor="middle">2. CNN 输入映射</text>
  <text class="formula" x="600" y="294" text-anchor="middle">3×3 Conv: 9 → C_b + GroupNorm + ReLU</text>
  <text class="small" x="600" y="316" text-anchor="middle">C_b = cnn_channels，默认 32；padding=1，空间尺寸不变</text>

  <path class="arrow" d="M 600 322 L 600 354"/>

  <!-- Residual blocks -->
  <rect class="blue" filter="url(#shadow)" x="205" y="358" width="790" height="116" rx="16"/>
  <text class="box-title" x="600" y="390" text-anchor="middle">3. 共享残差主干</text>
  <text class="formula" x="600" y="420" text-anchor="middle">ResidualBlock × 3，dilation = (1, 1, 2)</text>
  <text class="small" x="600" y="447" text-anchor="middle">每块：空洞 3×3 Conv + GN + ReLU → 普通 3×3 Conv + GN → 残差相加 + ReLU</text>
  <text class="small" x="600" y="468" text-anchor="middle">输出保持 [B, C_b, H, W]，默认 [B, 32, H, W]</text>

  <path class="arrow" d="M 600 474 L 600 506"/>

  <!-- Shared split -->
  <rect class="cyan" x="410" y="510" width="380" height="58" rx="14"/>
  <text class="box-title" x="600" y="547" text-anchor="middle">共享空间特征</text>
  <path class="arrow" d="M 520 568 L 320 618"/>
  <path class="arrow" d="M 680 568 L 880 618"/>

  <!-- Global branch -->
  <rect class="cyan" filter="url(#shadow)" x="80" y="622" width="470" height="126" rx="16"/>
  <text class="box-title" x="315" y="654" text-anchor="middle">4A. 全局分支</text>
  <text class="formula" x="315" y="686" text-anchor="middle">1×1 Conv: C_b → Cₚ + GN + ReLU</text>
  <text class="box-text" x="315" y="716" text-anchor="middle">完整 H×W 展平</text>
  <text class="formula" x="315" y="740" text-anchor="middle">[B, Cₚ·H·W]</text>

  <!-- Local branch -->
  <rect class="cyan" filter="url(#shadow)" x="650" y="622" width="470" height="126" rx="16"/>
  <text class="box-title" x="885" y="654" text-anchor="middle">4B. 蛇头局部分支</text>
  <text class="formula" x="885" y="686" text-anchor="middle">1×1 Conv: C_b → Cₚ + GN + ReLU</text>
  <text class="box-text" x="885" y="716" text-anchor="middle">以蛇头为中心提取 5×5（边界补零）</text>
  <text class="formula" x="885" y="740" text-anchor="middle">[B, 25·Cₚ]　默认 200 维</text>

  <path class="arrow" d="M 315 748 L 470 806"/>
  <path class="arrow" d="M 885 748 L 730 806"/>

  <!-- Spatial concat -->
  <rect class="cyan" filter="url(#shadow)" x="270" y="810" width="660" height="82" rx="16"/>
  <text class="box-title" x="600" y="842" text-anchor="middle">5. 拼接全局与局部空间特征</text>
  <text class="formula" x="600" y="874" text-anchor="middle">Cₚ·H·W + 25·Cₚ　｜　默认 8HW + 200</text>

  <!-- Auxiliary input and fusion -->
  <path class="arrow" d="M 600 892 L 600 932"/>
  <rect class="green" filter="url(#shadow)" x="75" y="918" width="300" height="84" rx="16"/>
  <text class="box-title" x="225" y="952" text-anchor="middle">20 维人工状态</text>
  <text class="small" x="225" y="980" text-anchor="middle">仅 Hybrid 模式拼接</text>
  <path class="arrow" d="M 375 960 L 460 960"/>

  <rect class="green" filter="url(#shadow)" x="460" y="922" width="665" height="78" rx="16"/>
  <text class="box-title" x="792" y="952" text-anchor="middle">6. Hybrid 特征融合</text>
  <text class="formula" x="792" y="982" text-anchor="middle">Cₚ·H·W + 25·Cₚ + 20　｜　默认 8HW + 220</text>

  <path class="arrow" d="M 792 1000 L 792 1038 L 600 1038 L 600 1062"/>

  <!-- Shared FC -->
  <rect class="orange" filter="url(#shadow)" x="260" y="1066" width="680" height="86" rx="16"/>
  <text class="box-title" x="600" y="1100" text-anchor="middle">7. 共享决策特征</text>
  <text class="formula" x="600" y="1132" text-anchor="middle">Linear(fused_size → hidden_size) + ReLU　｜　默认 → 256</text>

  <path class="arrow" d="M 520 1152 L 350 1198"/>
  <path class="arrow" d="M 680 1152 L 850 1198"/>

  <!-- Dueling streams -->
  <rect class="purple" filter="url(#shadow)" x="100" y="1202" width="470" height="126" rx="16"/>
  <text class="box-title" x="335" y="1236" text-anchor="middle">8A. Value Stream</text>
  <text class="formula" x="335" y="1270" text-anchor="middle">256 → 128 + ReLU → 1</text>
  <text class="box-text" x="335" y="1303" text-anchor="middle">状态价值 V(s)</text>

  <rect class="purple" filter="url(#shadow)" x="630" y="1202" width="470" height="126" rx="16"/>
  <text class="box-title" x="865" y="1236" text-anchor="middle">8B. Advantage Stream</text>
  <text class="formula" x="865" y="1270" text-anchor="middle">256 → 128 + ReLU → 3</text>
  <text class="box-text" x="865" y="1303" text-anchor="middle">动作优势 A(s,a)</text>

  <path class="arrow" d="M 335 1328 L 480 1372"/>
  <path class="arrow" d="M 865 1328 L 720 1372"/>

  <!-- Dueling combine -->
  <rect class="purple" filter="url(#shadow)" x="245" y="1376" width="710" height="80" rx="16"/>
  <text class="box-title" x="600" y="1408" text-anchor="middle">9. Dueling 合并</text>
  <text class="formula" x="600" y="1438" text-anchor="middle">Q(s,a) = V(s) + A(s,a) − meanₐ A(s,a)</text>

  <path class="arrow" d="M 600 1456 L 600 1484"/>

  <!-- Output -->
  <rect class="orange" filter="url(#shadow)" x="315" y="1488" width="570" height="70" rx="16"/>
  <text class="box-title" x="600" y="1520" text-anchor="middle">10. 三个动作 Q 值</text>
  <text class="formula" x="600" y="1547" text-anchor="middle">[直行, 右转, 左转]</text>

  <!-- Variant notes -->
  <rect class="gray" x="55" y="1590" width="1090" height="66" rx="14"/>
  <text class="small" x="600" y="1616" text-anchor="middle">其他路径：Grid 不拼接 20 维人工状态；Vector 使用两层 MLP，并直接输出 Value/Advantage。</text>
  <text class="small" x="600" y="1642" text-anchor="middle">dueling=False 时跳过双流结构，由共享特征经单个 Linear 直接输出三个 Q 值；Cₚ 可用 --cnn-output-channels 修改。</text>
</svg>
