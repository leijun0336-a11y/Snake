[project]
name = "snake"
version = "0.1.0"
description = "A DQN-based Snake AI project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pygame>=2.6",
    "tensorboard>=2.17",
    # torch 使用 AutoDL 自带的 (2.5.1+cu124)
]

[project.scripts]
snake-train = "snake_ai.train:main"
snake-evaluate = "snake_ai.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
